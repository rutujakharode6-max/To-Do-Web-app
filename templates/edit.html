{% extends "base.html" %}

{% block title %}Edit Task - Flask Todo App{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0 p-4">
            <h2 class="text-center fw-bold text-primary mb-4">Edit Task</h2>
            <form action="{{ url_for('edit_task', task_id=task.id) }}" method="POST">
                <div class="mb-3">
                    <label for="title" class="form-label fw-bold small text-uppercase text-secondary">Title</label>
                    <input type="text" name="title" id="title" class="form-control form-control-lg" value="{{ task.title }}" required>
                </div>
                <div class="mb-4">
                    <label for="description" class="form-label fw-bold small text-uppercase text-secondary">Description</label>
                    <textarea name="description" id="description" class="form-control" rows="4">{{ task.description }}</textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1 fw-bold">Update Task</button>
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary px-4 fw-bold">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
